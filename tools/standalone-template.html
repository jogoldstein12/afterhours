<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>After Hours Party Game</title>
<meta name="description" content="Neon-styled party game for adults." />
<meta name="theme-color" content="#0A040F" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --background:285 56% 5%;
  --foreground:0 0% 98%;
  --card:285 50% 10%;
  --primary:283 85% 63%;
  --secondary:328 86% 64%;
  --muted-foreground:0 0% 63.9%;
  --accent:328 86% 64%;
  --destructive:0 72% 51%;
  --border:285 30% 25%;
  --input:285 40% 15%;
  --radius:0.5rem;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  font-family:'Space Grotesk','Inter',system-ui,-apple-system,sans-serif;
  background:hsl(var(--background));
  color:hsl(var(--foreground));
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- Atmosphere ---------- */
.atmosphere{
  position:fixed;inset:0;z-index:-10;overflow:hidden;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#1a0b2e 0%,#0a040f 100%);
}
.smoke{position:absolute;animation:drift 20s ease-in-out infinite alternate;filter:blur(60px);opacity:.4;}
.smoke svg{width:100%;height:100%;}
.smoke-1{top:-10%;left:-10%;width:120%;height:120%;color:hsl(var(--primary)/.2);}
.smoke-2{bottom:-10%;right:-10%;width:100%;height:100%;color:hsl(var(--secondary)/.3);animation-duration:25s;animation-delay:-5s;}
@keyframes drift{
  from{transform:translateX(-10%) translateY(-10%) rotate(0deg);}
  to{transform:translateX(10%) translateY(10%) rotate(5deg);}
}

/* ---------- Neon helpers ---------- */
.neon-text-primary{text-shadow:0 0 5px hsl(var(--primary)),0 0 10px hsl(var(--primary)/.7),0 0 20px hsl(var(--primary)/.3);}
.neon-text-accent{text-shadow:0 0 5px hsl(var(--accent)),0 0 10px hsl(var(--accent)),0 0 15px hsl(var(--accent)),0 0 20px hsl(var(--accent)/.5);}
.neon-border-primary{box-shadow:0 0 5px hsl(var(--primary)),0 0 10px hsl(var(--primary)/.7);}
.neon-border-violet{border-color:hsl(var(--primary));box-shadow:0 0 5px hsl(var(--primary)),0 0 10px hsl(var(--primary)/.5),inset 0 0 10px hsl(var(--primary)/.3);}
.neon-border-pink{border-color:hsl(var(--secondary));box-shadow:0 0 5px hsl(var(--secondary)),0 0 10px hsl(var(--secondary)/.5),inset 0 0 10px hsl(var(--secondary)/.3);}
.neon-border-red{border-color:hsl(var(--destructive));box-shadow:0 0 20px rgba(255,0,0,.4),inset 0 0 10px rgba(255,0,0,.2);}
.glass-card{background:rgba(10,4,15,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);}

/* ---------- Layout ---------- */
.screen{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;}
.screen.active{display:flex;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:1rem;}
.logo svg{color:hsl(var(--secondary));filter:drop-shadow(0 0 10px rgba(242,82,169,.9));flex-shrink:0;}
.logo-words{display:flex;flex-direction:column;line-height:1.1;}
.logo-title{font-size:1.5rem;font-weight:700;letter-spacing:-.025em;color:hsl(var(--primary));}
.logo-sub{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:hsl(var(--muted-foreground));opacity:.7;}
@media(min-width:768px){.logo-title{font-size:1.875rem;}}

/* ---------- Cards ---------- */
.card{width:100%;border-radius:var(--radius);overflow:hidden;}
.setup-card{max-width:28rem;border:1px solid rgba(255,255,255,.1);}
.card-header{text-align:center;padding:1.5rem;}
.card-title{font-size:1.875rem;font-weight:700;color:hsl(var(--primary));}
.card-desc{color:hsl(var(--muted-foreground));font-size:.875rem;margin-top:.25rem;}
.card-content{padding:0 1.5rem 1.5rem;display:flex;flex-direction:column;gap:1.5rem;}
.card-footer{padding:0 1.5rem 1.5rem;}
.field{display:flex;flex-direction:column;gap:.75rem;}
.field-label{font-size:1.125rem;font-weight:500;color:hsl(var(--accent));display:flex;align-items:center;gap:.5rem;}

/* ---------- Controls ---------- */
input[type=text]{
  width:100%;padding:.5rem .75rem;font:inherit;font-size:.95rem;
  background:hsl(var(--input));color:hsl(var(--foreground));
  border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);
}
input[type=text]::placeholder{color:hsl(var(--muted-foreground));}
input[type=text]:focus{outline:none;box-shadow:0 0 5px hsl(var(--accent)),0 0 10px hsl(var(--accent)/.7);border-color:hsl(var(--accent));}
.player-row{display:flex;align-items:center;gap:.5rem;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:disabled{opacity:.4;cursor:not-allowed;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border-radius:calc(var(--radius) - 2px);padding:.6rem 1rem;font-weight:500;
  transition:background-color .2s,transform .1s,opacity .2s;
}
.btn-primary{background:hsl(var(--primary));color:#fff;}
.btn-primary:hover{background:hsl(var(--primary)/.9);}
.btn-destructive{background:hsl(var(--destructive));color:#fff;}
.btn-outline{border:1px solid hsl(var(--accent));color:hsl(var(--accent));width:100%;}
.btn-outline:hover{background:hsl(var(--accent)/.1);}
.btn-ghost{padding:.35rem .6rem;border-radius:calc(var(--radius) - 2px);}
.btn-ghost:hover{background:rgba(255,255,255,.05);}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;padding:0;width:2.25rem;height:2.25rem;border-radius:calc(var(--radius) - 2px);flex-shrink:0;}
.btn-start{width:100%;font-size:1.125rem;padding:1.1rem;font-weight:700;}
.icon-destructive{color:hsl(var(--destructive));}

/* ---------- Segmented radio ---------- */
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;background:hsl(var(--input));padding:.25rem;border-radius:var(--radius);}
.segmented.subtle{background:rgba(255,255,255,.05);border-radius:.75rem;}
.seg{
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:.5rem .75rem;font-size:.875rem;font-weight:500;cursor:pointer;
  border-radius:calc(var(--radius) - 2px);transition:background-color .2s,box-shadow .2s;
}
.seg:hover{background:hsl(var(--primary)/.2);}
.seg[aria-checked=true]{background:hsl(var(--primary));color:#fff;box-shadow:0 0 5px hsl(var(--primary)),0 0 10px hsl(var(--primary)/.7);}
.seg input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

/* ---------- Game card ---------- */
.game-card{max-width:56rem;border:1px solid rgba(255,255,255,.1);transition:box-shadow .5s,border-color .5s;}
.game-header{
  border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.05);
  padding:1rem;position:relative;min-height:90px;display:flex;align-items:center;
}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;width:100%;position:relative;z-index:10;}
.header-side{display:flex;flex-direction:column;gap:.25rem;align-items:center;min-width:100px;}
.badge{
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:.1rem .5rem;
  border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);border-radius:9999px;white-space:nowrap;
}
.current-player{
  font-size:1.25rem;font-weight:700;color:#fff;letter-spacing:-.025em;line-height:1;
  height:28px;display:flex;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.header-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);z-index:0;}
.player-count{font-size:9px;text-transform:uppercase;font-weight:700;letter-spacing:-.02em;opacity:.5;height:28px;display:flex;align-items:center;}
@media(min-width:640px){
  .game-header{padding:1rem 1.5rem;}
  .badge{font-size:10px;}
  .current-player{font-size:1.5rem;height:32px;}
  .header-logo{transform:translate(-50%,-50%) scale(.75);}
  .player-count{font-size:10px;height:32px;}
}
@media(min-width:768px){.current-player{font-size:1.875rem;}}

.prompt-area{min-height:25vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
@media(min-width:768px){.prompt-area{min-height:30vh;padding:2.5rem;}}
.prompt-text{
  font-size:1.25rem;font-weight:500;line-height:1.25;color:#fff;text-align:center;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));animation:cardEnter .5s ease-out forwards;
}
@media(min-width:768px){.prompt-text{font-size:1.875rem;}}
@keyframes cardEnter{
  from{opacity:0;transform:translateY(20px) scale(.95);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.game-over{text-align:center;display:flex;flex-direction:column;gap:1rem;animation:fadeIn .3s ease-in-out;}
.game-over h2{font-size:1.875rem;font-weight:700;color:hsl(var(--secondary));}
.game-over p{color:hsl(var(--muted-foreground));font-size:1.125rem;font-style:italic;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.game-footer{background:rgba(255,255,255,.05);padding:1rem;display:flex;flex-direction:column;gap:1rem;align-items:center;}
@media(min-width:768px){.game-footer{padding:1.5rem;}}
.btn-next{min-width:200px;font-size:1.125rem;font-weight:700;padding:1.1rem 1.5rem;border-radius:.75rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);}
.btn-next:hover{transform:scale(1.02);}
.btn-next:active{transform:scale(.95);}
.footer-actions{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap;padding-top:.5rem;}
.btn-mini{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.6;display:inline-flex;align-items:center;gap:.5rem;}
.btn-mini:hover{opacity:1;background:rgba(255,255,255,.05);}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s ease-out;}
.overlay.open{display:flex;}
.dialog{max-width:32rem;width:100%;border-radius:var(--radius);padding:1.5rem;display:flex;flex-direction:column;gap:1rem;}
.dialog h2{font-size:1.125rem;font-weight:700;}
.dialog p{color:hsl(var(--muted-foreground));font-size:.875rem;}
.dialog-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;}
.btn-cancel{background:transparent;border:1px solid rgba(255,255,255,.1);}
.btn-cancel:hover{background:rgba(255,255,255,.05);}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;animation:fadeIn .2s ease-out;}
.sheet-overlay.open{display:block;}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:24rem;z-index:51;
  border-left:1px solid rgba(255,255,255,.1);padding:1.5rem;overflow-y:auto;
  display:flex;flex-direction:column;gap:1rem;transform:translateX(100%);transition:transform .3s ease-out;
}
.sheet.open{transform:translateX(0);}
.sheet h2{font-size:1.125rem;font-weight:700;}
.sheet-desc{color:hsl(var(--muted-foreground));font-size:.875rem;}
.sheet-section{display:flex;flex-direction:column;gap:1rem;}
.sheet-label{color:hsl(var(--accent));text-transform:uppercase;letter-spacing:-.02em;font-size:.7rem;font-weight:700;}
.roster{display:flex;flex-direction:column;gap:.5rem;max-height:40vh;overflow-y:auto;padding-right:.5rem;}
.roster-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem;border-radius:.5rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);gap:.5rem;}
.roster-row span{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.add-row{display:flex;gap:.5rem;padding-top:.5rem;}
.add-row input{background:rgba(255,255,255,.05);}
.btn-add{background:hsl(var(--accent));color:#fff;}
.btn-add:hover{background:hsl(var(--accent)/.8);}
.separator{height:1px;background:rgba(255,255,255,.1);border:0;}
.sheet-footer{margin-top:auto;padding-top:1rem;}
.sheet-footer .btn{width:100%;}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:1rem;right:1rem;z-index:100;display:flex;flex-direction:column;gap:.5rem;max-width:calc(100vw - 2rem);}
.toast{
  min-width:16rem;padding:.75rem 1rem;border-radius:var(--radius);
  background:hsl(var(--card));border:1px solid hsl(var(--border));
  box-shadow:0 10px 20px rgba(0,0,0,.5);animation:toastIn .2s ease-out;
}
.toast.destructive{border-color:hsl(var(--destructive));background:hsl(var(--destructive)/.15);}
.toast-title{font-weight:700;font-size:.875rem;}
.toast-desc{font-size:.8rem;color:hsl(var(--muted-foreground));margin-top:.15rem;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>

<div class="atmosphere" aria-hidden="true">
  <div class="smoke smoke-1">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.5,90.1,-16.3,88.5,-0.9C86.9,14.4,81.1,28.8,72.1,40.4C63.1,52,50.8,60.8,37.7,67.8C24.5,74.8,10.6,80,0,80C-10.6,80,-21.2,74.8,-32.4,68.4C-43.7,62,-55.5,54.4,-65.4,43.5C-75.3,32.7,-83.1,18.5,-84,3.7C-84.9,-11.1,-78.9,-26.4,-69.8,-38.7C-60.7,-51,-48.5,-60.3,-35.4,-68C-22.3,-75.7,-8.4,-81.8,4.7,-89.9C17.7,-98,30.6,-83.6,44.7,-76.4Z" transform="translate(100 100)"/></svg>
  </div>
  <div class="smoke smoke-2">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M39.9,-65.7C50.3,-59.5,56.1,-45.6,62.2,-32.1C68.3,-18.6,74.7,-5.5,73.5,7.1C72.3,19.7,63.5,31.8,53.2,41.9C42.9,52,31.1,60.2,18.2,64.2C5.4,68.2,-8.4,68,-21.6,63.9C-34.8,59.8,-47.4,51.8,-56.3,40.8C-65.2,29.8,-70.4,15.9,-71.4,1.8C-72.3,-12.3,-69.1,-26.5,-61.2,-38.6C-53.3,-50.7,-40.7,-60.8,-27.4,-65.4C-14,-70.1,0.1,-69.2,14.6,-70.8C29.2,-72.4,39.9,-71.9,39.9,-65.7Z" transform="translate(100 100)"/></svg>
  </div>
</div>

<!-- ============ SETUP SCREEN ============ -->
<div class="screen active" id="setup-screen">
  <header style="padding:1.5rem 1rem;display:flex;justify-content:center;">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12l-6 9Z"/><path d="M12 12v9"/><path d="M7 21h10"/><path d="m15 3 1 4"/>
        <circle cx="12" cy="7" r="1" fill="currentColor"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
      </svg>
      <div class="logo-words">
        <span class="logo-title neon-text-primary">AFTER HOURS</span>
        <span class="logo-sub">Party Game</span>
      </div>
    </div>
  </header>
  <main>
    <div class="card setup-card glass-card neon-border-primary">
      <div class="card-header">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:hsl(var(--primary));margin:0 auto .5rem;">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <h1 class="card-title neon-text-primary">Game Setup</h1>
        <p class="card-desc">Where the night gets interesting!</p>
      </div>
      <div class="card-content">
        <div class="field">
          <span class="field-label neon-text-accent">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Players
          </span>
          <div id="setup-players"></div>
          <button class="btn btn-outline" id="add-player-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            Add Player
          </button>
        </div>
        <div class="field">
          <span class="field-label neon-text-accent">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            NSFW Level
          </span>
          <div class="segmented" id="setup-level" role="radiogroup" aria-label="NSFW Level"></div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary btn-start neon-border-primary" id="start-game-btn">Start Game</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ GAME SCREEN ============ -->
<div class="screen" id="game-screen">
  <main>
    <div class="card game-card glass-card" id="game-card">
      <div class="game-header">
        <div class="header-row">
          <div class="header-side">
            <span class="badge" id="level-badge">Mild Mode</span>
            <h2 class="current-player" id="current-player"></h2>
          </div>
          <div class="header-logo">
            <div class="logo">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3h12l-6 9Z"/><path d="M12 12v9"/><path d="M7 21h10"/><path d="m15 3 1 4"/>
                <circle cx="12" cy="7" r="1" fill="currentColor"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
              </svg>
              <div class="logo-words">
                <span class="logo-title neon-text-primary">AFTER HOURS</span>
                <span class="logo-sub">Party Game</span>
              </div>
            </div>
          </div>
          <div class="header-side">
            <span class="badge"># Of Players</span>
            <div class="player-count" id="player-count"></div>
          </div>
        </div>
      </div>

      <div class="prompt-area" id="prompt-area"></div>

      <div class="game-footer">
        <button class="btn btn-primary btn-next" id="next-btn">
          <span id="next-btn-label">Next Player</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>
        </button>
        <div class="footer-actions">
          <button class="btn btn-ghost btn-mini" id="manage-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Manage Group
          </button>
          <button class="btn btn-ghost btn-mini" id="end-game-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            End Game
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ NEW GAME DIALOG ============ -->
<div class="overlay" id="newgame-overlay" role="dialog" aria-modal="true" aria-labelledby="newgame-title">
  <div class="dialog glass-card">
    <h2 id="newgame-title">Start a New Session?</h2>
    <p>Restart the current deck or head back to setup.</p>
    <div class="dialog-actions">
      <button class="btn btn-cancel" id="dialog-cancel">Cancel</button>
      <button class="btn btn-destructive" id="dialog-newgame">New Game</button>
      <button class="btn btn-primary" id="dialog-restart">Restart Deck</button>
    </div>
  </div>
</div>

<!-- ============ MANAGE GROUP SHEET ============ -->
<div class="sheet-overlay" id="sheet-overlay"></div>
<aside class="sheet glass-card" id="manage-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div>
    <h2 id="sheet-title">Game Settings</h2>
    <p class="sheet-desc">Modify players and intensity on the fly.</p>
  </div>
  <div class="sheet-section">
    <span class="sheet-label neon-text-accent">Manage Players</span>
    <div class="roster" id="roster"></div>
    <div class="add-row">
      <input type="text" id="new-player-input" placeholder="Player Name" aria-label="New player name" />
      <button class="btn btn-icon btn-add" id="sheet-add-btn" aria-label="Add player">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
      </button>
    </div>
  </div>
  <hr class="separator" />
  <div class="sheet-section">
    <span class="sheet-label neon-text-accent">Intensity Level</span>
    <div class="segmented subtle" id="sheet-level" role="radiogroup" aria-label="Intensity Level"></div>
  </div>
  <div class="sheet-footer">
    <button class="btn btn-primary" id="sheet-close">Save Changes</button>
  </div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";

/* ------------------------------------------------------------------
   Prompt deck — generated from src/lib/prompts.ts
   ------------------------------------------------------------------ */
const PROMPTS = __PROMPTS_JSON__;

const LEVELS = ['Mild', 'Medium', 'Extreme'];
const MIN_PLAYERS = 2;
const MAX_PLAYERS = 10;

/* Some prompts in the source deck share an id, so the deck is tracked by
   position rather than by id — otherwise a duplicate id would retire both. */
const DECK = PROMPTS.map((p, index) => ({ index: index, text: p.text, nsfwLevel: p.nsfwLevel }));

const state = {
  setupNames: ['', ''],
  players: [],
  nsfwLevel: 'Mild',
  currentPlayerIndex: 0,
  available: [],
  used: new Set(),
  currentPrompt: null,
  promptText: '',
  cardKey: 0,
  gameEnded: false,
};

const $ = (id) => document.getElementById(id);

/* ---------------- Toasts ---------------- */
function toast(title, description, variant) {
  const el = document.createElement('div');
  el.className = 'toast' + (variant === 'destructive' ? ' destructive' : '');
  const t = document.createElement('div');
  t.className = 'toast-title';
  t.textContent = title;
  el.appendChild(t);
  if (description) {
    const d = document.createElement('div');
    d.className = 'toast-desc';
    d.textContent = description;
    el.appendChild(d);
  }
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ---------------- Segmented level pickers ---------------- */
function renderLevelPicker(container, onSelect) {
  container.textContent = '';
  LEVELS.forEach((level) => {
    const label = document.createElement('label');
    label.className = 'seg';
    label.setAttribute('role', 'radio');
    label.setAttribute('aria-checked', String(state.nsfwLevel === level));
    label.setAttribute('tabindex', '0');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = container.id;
    input.value = level;
    input.checked = state.nsfwLevel === level;
    label.appendChild(input);
    label.appendChild(document.createTextNode(level));
    const pick = () => onSelect(level);
    label.addEventListener('click', pick);
    label.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
    });
    container.appendChild(label);
  });
}

/* ---------------- Setup screen ---------------- */
function renderSetupPlayers() {
  const wrap = $('setup-players');
  wrap.textContent = '';
  state.setupNames.forEach((name, index) => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.style.marginBottom = '.5rem';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Player ' + (index + 1);
    input.value = name;
    input.setAttribute('aria-label', 'Player ' + (index + 1) + ' name');
    input.addEventListener('input', (e) => { state.setupNames[index] = e.target.value; });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGame(); });
    row.appendChild(input);

    if (state.setupNames.length > MIN_PLAYERS) {
      const remove = document.createElement('button');
      remove.className = 'btn btn-ghost btn-icon';
      remove.setAttribute('aria-label', 'Remove player ' + (index + 1));
      remove.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-destructive"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>';
      remove.addEventListener('click', () => removeSetupPlayer(index));
      row.appendChild(remove);
    }
    wrap.appendChild(row);
  });
  $('add-player-btn').style.display = state.setupNames.length < MAX_PLAYERS ? '' : 'none';
}

function addSetupPlayer() {
  if (state.setupNames.length < MAX_PLAYERS) {
    state.setupNames.push('');
    renderSetupPlayers();
  } else {
    toast('Max Players Reached', 'You can add up to ' + MAX_PLAYERS + ' players.', 'destructive');
  }
}

function removeSetupPlayer(index) {
  if (state.setupNames.length > MIN_PLAYERS) {
    state.setupNames.splice(index, 1);
    renderSetupPlayers();
  } else {
    toast('Minimum Players', 'You need at least ' + MIN_PLAYERS + ' players.', 'destructive');
  }
}

function startGame() {
  const valid = state.setupNames.map((n) => n.trim()).filter((n) => n !== '');
  if (valid.length < MIN_PLAYERS) {
    toast('Not Enough Players', 'Please enter names for at least ' + MIN_PLAYERS + ' players.', 'destructive');
    return;
  }
  state.players = valid;
  state.currentPlayerIndex = 0;
  loadDeck();
  selectNewPrompt();
  showScreen('game');
  renderGame();
}

/* ---------------- Deck handling ---------------- */
function loadDeck() {
  state.available = DECK.filter((p) => p.nsfwLevel === state.nsfwLevel);
  state.used = new Set();
  state.gameEnded = false;
}

function selectNewPrompt() {
  state.cardKey += 1;
  const remaining = state.available.filter((p) => !state.used.has(p.index));
  if (remaining.length === 0) {
    state.gameEnded = true;
    state.currentPrompt = null;
    state.promptText = '';
    return;
  }
  state.currentPrompt = remaining[Math.floor(Math.random() * remaining.length)];
  state.promptText = processPromptText();
}

const PREFIX_EXCEPTIONS = ['if', 'everyone', 'anybody', 'anyone', 'the ', 'girls', 'men', 'women', 'no one', 'shortest', 'dominant'];

function processPromptText() {
  if (state.gameEnded || !state.currentPrompt) return '';
  let text = state.currentPrompt.text;
  const currentPlayerName = state.players[state.currentPlayerIndex];

  if (text.indexOf('{{randomOtherPlayer}}') !== -1) {
    const others = state.players.filter((_, i) => i !== state.currentPlayerIndex);
    const replacement = others.length > 0
      ? others[Math.floor(Math.random() * others.length)]
      : 'another player';
    text = text.replace(/\{\{randomOtherPlayer\}\}/g, replacement);
  }

  const trimmedLower = text.trim().toLowerCase();
  const needsPrefix = text.indexOf('?') === -1 &&
    !PREFIX_EXCEPTIONS.some((word) => trimmedLower.startsWith(word));

  if (text.length > 0) {
    text = needsPrefix
      ? currentPlayerName + ', ' + text.charAt(0).toLowerCase() + text.slice(1)
      : text.charAt(0).toUpperCase() + text.slice(1);
  }
  return text;
}

function nextTurn() {
  if (state.gameEnded || !state.currentPrompt) return;
  state.used.add(state.currentPrompt.index);
  // The player is randomised before the prompt is picked so that the prompt
  // text is resolved against the player whose turn it actually is.
  state.currentPlayerIndex = Math.floor(Math.random() * state.players.length);
  selectNewPrompt();
  renderGame();
}

function restartDeck() {
  state.currentPlayerIndex = 0;
  loadDeck();
  selectNewPrompt();
  closeDialog();
  renderGame();
}

function changeLevel(level) {
  state.nsfwLevel = level;
  renderLevelPicker($('setup-level'), (l) => changeLevel(l));
  renderLevelPicker($('sheet-level'), (l) => changeLevel(l));
  if (state.players.length > 0) {
    loadDeck();
    selectNewPrompt();
    renderGame();
  }
}

/* ---------------- Game screen ---------------- */
function renderGame() {
  const card = $('game-card');
  card.classList.remove('neon-border-violet', 'neon-border-pink', 'neon-border-red');
  card.classList.add(
    state.nsfwLevel === 'Mild' ? 'neon-border-violet'
      : state.nsfwLevel === 'Medium' ? 'neon-border-pink'
        : 'neon-border-red'
  );

  $('level-badge').textContent = state.nsfwLevel + ' Mode';
  $('current-player').textContent = state.gameEnded ? '' : state.players[state.currentPlayerIndex];
  $('player-count').textContent = state.players.length + (state.players.length === 1 ? ' Player' : ' Players');

  const area = $('prompt-area');
  // Re-use the existing node when the card hasn't changed, so editing the
  // roster mid-prompt doesn't replay the card-enter animation.
  if (!state.gameEnded && area.dataset.cardKey === String(state.cardKey)) {
    area.firstChild.textContent = state.promptText;
    renderRoster();
    return;
  }
  area.dataset.cardKey = String(state.cardKey);
  area.textContent = '';
  if (state.gameEnded) {
    const wrap = document.createElement('div');
    wrap.className = 'game-over';
    const h = document.createElement('h2');
    h.className = 'neon-text-accent';
    h.textContent = 'Last Call!';
    const p = document.createElement('p');
    p.textContent = 'The deck is empty. Pass the phone and restart.';
    wrap.appendChild(h);
    wrap.appendChild(p);
    area.appendChild(wrap);
  } else {
    const p = document.createElement('p');
    p.className = 'prompt-text';
    p.textContent = state.promptText;
    area.appendChild(p);
  }

  $('next-btn-label').textContent = state.gameEnded ? 'Restart Deck' : 'Next Player';
  renderRoster();
}

/* ---------------- Manage group sheet ---------------- */
function renderRoster() {
  const roster = $('roster');
  roster.textContent = '';
  state.players.forEach((player, index) => {
    const row = document.createElement('div');
    row.className = 'roster-row';
    const name = document.createElement('span');
    name.textContent = player;
    row.appendChild(name);

    const del = document.createElement('button');
    del.className = 'btn btn-ghost btn-icon';
    del.setAttribute('aria-label', 'Remove ' + player);
    del.disabled = state.players.length <= MIN_PLAYERS;
    del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-destructive"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    del.addEventListener('click', () => removePlayer(index));
    row.appendChild(del);
    roster.appendChild(row);
  });
}

function addPlayer() {
  const input = $('new-player-input');
  const name = input.value.trim();
  if (!name) return toast('Player name cannot be empty.', '', 'destructive');
  if (state.players.length >= MAX_PLAYERS) return toast('Limit: ' + MAX_PLAYERS + ' players.', '', 'destructive');
  state.players.push(name);
  input.value = '';
  renderGame();
}

function removePlayer(indexToRemove) {
  if (state.players.length <= MIN_PLAYERS) {
    return toast('Minimum ' + MIN_PLAYERS + ' players required.', '', 'destructive');
  }
  const previousPlayer = state.players[state.currentPlayerIndex];
  state.players.splice(indexToRemove, 1);
  if (state.currentPlayerIndex >= state.players.length) {
    state.currentPlayerIndex = state.players.length - 1;
  }
  if (!state.gameEnded && state.players[state.currentPlayerIndex] !== previousPlayer) {
    state.promptText = processPromptText();
  }
  renderGame();
}

/* ---------------- Screens & overlays ---------------- */
function showScreen(which) {
  $('setup-screen').classList.toggle('active', which === 'setup');
  $('game-screen').classList.toggle('active', which === 'game');
}

function openDialog() { $('newgame-overlay').classList.add('open'); }
function closeDialog() { $('newgame-overlay').classList.remove('open'); }

function openSheet() {
  renderRoster();
  $('sheet-overlay').classList.add('open');
  $('manage-sheet').classList.add('open');
}
function closeSheet() {
  $('sheet-overlay').classList.remove('open');
  $('manage-sheet').classList.remove('open');
}

function backToSetup() {
  closeDialog();
  state.setupNames = state.players.length >= MIN_PLAYERS ? state.players.slice() : ['', ''];
  state.players = [];
  state.gameEnded = false;
  state.currentPrompt = null;
  renderSetupPlayers();
  showScreen('setup');
}

/* ---------------- Wiring ---------------- */
$('add-player-btn').addEventListener('click', addSetupPlayer);
$('start-game-btn').addEventListener('click', startGame);
$('next-btn').addEventListener('click', () => (state.gameEnded ? restartDeck() : nextTurn()));
$('manage-btn').addEventListener('click', openSheet);
$('end-game-btn').addEventListener('click', openDialog);
$('dialog-cancel').addEventListener('click', closeDialog);
$('dialog-newgame').addEventListener('click', backToSetup);
$('dialog-restart').addEventListener('click', restartDeck);
$('sheet-close').addEventListener('click', closeSheet);
$('sheet-overlay').addEventListener('click', closeSheet);
$('sheet-add-btn').addEventListener('click', addPlayer);
$('new-player-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addPlayer(); });
$('newgame-overlay').addEventListener('click', (e) => { if (e.target === $('newgame-overlay')) closeDialog(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDialog(); closeSheet(); }
});

renderSetupPlayers();
renderLevelPicker($('setup-level'), (l) => changeLevel(l));
renderLevelPicker($('sheet-level'), (l) => changeLevel(l));
</script>
</body>
</html>
