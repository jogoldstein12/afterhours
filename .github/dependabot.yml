version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor churn; majors and security fixes still
      # come through on their own so they get read properly.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major upgrades are ours to do deliberately, one at a time, on their own
      # branch — not raised automatically. A React major already proved why: it
      # moves four packages at once (react, react-dom, both @types) that
      # Dependabot splits into separate PRs, each half an upgrade whose peer
      # ranges cannot resolve, every one failing at `npm ci` (the closed #11 and
      # #13). Framework majors (Next, Tailwind 4, TypeScript 7) carry migrations
      # of the same kind. So majors are held here across the board; minors and
      # patches still come through as usual.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
