name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on a critical advisory. Not set to `high` yet: the tree
      # still carries build-time-only postcss issues that live inside Next's own
      # dependencies and are only fixable by a Next 16 major upgrade. Tighten
      # this to `high` once that lands.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Standalone build is in sync with the deck
        run: |
          npm run build:html
          git diff --exit-code -- game.html docs/prompts.csv
